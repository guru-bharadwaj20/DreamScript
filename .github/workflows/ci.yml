# Phase 15.9 - CI.
#
# What a GitHub runner has and this project mostly does not: no GPU, no DVC payload, no 1.3 GB
# checkpoints. `data/` is `.dvc` pointers in git and content in a DVC store that is **a directory
# on one Windows machine** - see docs/data_remote.md. A fresh clone gets the pointers and cannot
# fetch a byte behind them, here or anywhere else. That shape was measured rather than assumed - on a detached
# worktree with exactly it, 40 tests across 16 modules failed for want of the corpus - and
# `tests/conftest.py` now skips those with a reason instead. What is left runs here honestly.
#
# A runner installs from `requirements/`, which is the other half of why this job is worth having.
# On the development machine three OpenCV distributions were installed at once - the pinned
# `opencv-contrib-python==4.10.0.84` plus `opencv-python` and `opencv-python-headless` at 5.0.0.93,
# neither of them in any requirements file - and the undeclared 5.0 shadowed the pin. Four tests
# failed against `cv2.MSER` and `cv2.HoughLinesP` for that reason alone and were briefly mistaken
# for code regressions. A clean install from the pins is exactly what catches that.
#
# This workflow does NOT pull the payload. Doing so would need remote credentials and tens of
# gigabytes per run, and it would turn a three-minute check into something nobody waits for. The
# consequence is stated plainly rather than hidden: CI checks the code, the schemas and every
# test that does not need the corpus. It does not reproduce the headline metrics - 15.12 is the
# row that does that, on a machine with the data. Note that "would need remote credentials" is
# optimistic: there is no remote to have credentials for.

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint (ruff, black, isort, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install the linters only
        # Not the full stack: these need none of torch, CUDA or OpenCV, and
        # installing 3 GB of wheels to check formatting is how a lint job comes to take 8 minutes.
        run: pip install ruff==0.8.4 black==24.10.0 isort==5.13.2 mypy==2.3.1
      - run: ruff check src tests scripts app
      - run: black --check src tests scripts app
      - run: isort --check src tests scripts app
      - name: mypy, against its recorded baseline
        # mypy was installed on the development machine, reported 661 errors across 193 files,
        # and was in no gate at all. A pass/fail gate would make main red on day one and keep it
        # there; this one fails only on a *regression* against reports/mypy_baseline.json, so the
        # number can fall and cannot rise without `--update` putting it in a diff.
        #
        # No stack install: `ignore_missing_imports` is on precisely because third-party stubs
        # say nothing about this repo's code, so the checker needs no third-party packages.
        run: python scripts/typecheck.py

  schemas:
    name: schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install jsonschema==4.26.0
      - name: every schema in schemas/ is itself valid JSON Schema
        # A malformed schema does not fail loudly - it fails by validating nothing, which is the
        # failure mode worth catching in CI rather than in a report six phases later.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator
          bad = 0
          for path in sorted(pathlib.Path("schemas").glob("*.json")):
              try:
                  Draft202012Validator.check_schema(json.loads(path.read_text()))
                  print(f"ok    {path}")
              except Exception as exc:
                  print(f"BAD   {path}: {exc}", file=sys.stderr)
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

  client:
    name: client (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      # `npm ci`, not `npm install`: it installs exactly the committed lockfile and fails if the
      # lockfile and the manifest disagree, which is the whole reason the lockfile is in git.
      - run: npm ci
        working-directory: app/frontend
      # `npm run build` is `tsc --noEmit && vite build`. The typecheck is the half that matters
      # here: esbuild strips types without reading them, so `vite build` alone ships type errors.
      - run: npm run build
        working-directory: app/frontend
      # 33 tests, and the one that earns this job is the SSE reader's chunk-boundary sweep: a
      # parser that assumes each network chunk holds whole lines passes every hand-written test
      # and loses one frame per read against a real socket, silently.
      - run: npm test
        working-directory: app/frontend

  tests:
    name: tests (no DVC payload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: the shared libraries OpenCV loads at import
        # Without them `import cv2` fails with an error naming neither OpenCV nor the missing
        # library. The same two the Dockerfile installs, for the same reason.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: install the CPU stack
        # The CPU torch index, because the default wheel pulls a CUDA runtime this runner has no
        # use for and the download alone is longer than the whole job. `-r requirements/torch.txt`
        # rather than a bare `torch`: unpinned, the index resolved to 2.14.0 against a pinned
        # 2.5.1, so CI was testing a torch four minor versions from the one every metric in this
        # repo was measured on - the exact drift 15.12 exists to catch, in CI's own install step.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu -r requirements/torch.txt
          pip install -r requirements/base.txt
          pip install -r requirements/classical.txt
          pip install -r requirements/cv.txt
          pip install -r requirements/serve.txt
          pip install -r requirements/app.txt
          pip install -r requirements/genai.txt
          pip install -r requirements/test.txt
      # genai and serve are installed because their tests need no corpus, only their declared
      # dependencies - without them 12 tests across test_llm_quant, test_ocr_s3, test_ocr_styled
      # and test_llm_train failed as ModuleNotFoundError while claiming to be code failures.
      # One run, not two. This was `pytest tests -q` followed by an `if: always()` step running
      # `pytest tests -q -rs | tail -40` to print the skips - a second full execution of 6,700
      # tests for output the first run produces for free with `-rs`, which is now in
      # `pyproject.toml`'s addopts and applies to every invocation. On a suite this size it was
      # the single largest thing in the job.
      #
      # No `-q`: it stacks with addopts into `-qq`, which suppresses the totals line, so these
      # logs used to end at `short test summary info` with no pass, fail or skip count at all.
      - name: the suite, with corpus-dependent modules skipping and skip reasons printed
        run: python -m pytest tests

  smoke-train:
    name: tiny-model smoke train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: the shared libraries OpenCV loads at import
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu -r requirements/torch.txt
          pip install -r requirements/base.txt -r requirements/classical.txt -r requirements/cv.txt
      - name: train something end to end on the committed fixtures
        # 0.2.7's five synthetic sketches are committed (~15 KB) precisely so something can be
        # trained with no dataset present. This proves the training path imports, fits and scores
        # on CPU - not that any metric is good, which needs the corpus and is 15.12's job.
        run: python -m src.mlops.smoke --check

  image:
    name: docker build + container health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: reclaim disk for a CUDA image
        # The base is `nvidia/cuda:12.4.1-runtime` and the torch layer is the `+cu124` wheel set:
        # together they do not fit beside the runner's preinstalled toolchains. Removing what this
        # job provably does not use (dotnet, Android, GHC, the preloaded image cache) is the
        # difference between a build and a "no space left on device" at the last layer.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: the compose file parses and says what it claims
        # Parsing is not the same as being correct, so this also asserts the two properties the
        # row argues for: `model` starts by default and `app` does not, because app/backend and
        # app/frontend hold only .gitkeep until Phase 16.
        run: |
          docker compose config >/dev/null
          test "$(docker compose config --services)" = "model"
          docker compose --profile app config --services | grep -qx app

      - name: build the serve target
        # `target: serve` is what compose builds, so it is what CI builds. No push: this job
        # proves the image exists and runs, not that a registry has it.
        run: docker build --target serve -t dreamscript/model:ci .

      - name: the image is not root and imports its entry point
        # `| tail -1`, and it is not cosmetic. The CUDA base ships an ENTRYPOINT that prints a
        # licence banner to stdout on every run, so a bare `$(docker run ... id -u)` captures the
        # banner *and* the uid and never equals "10001". The first version of this step failed
        # for exactly that reason while the image underneath it was correct - the check was wrong,
        # not the Dockerfile.
        run: |
          uid="$(docker run --rm dreamscript/model:ci id -u | tail -1)"
          echo "uid=$uid"
          test "$uid" = "10001"
          docker run --rm dreamscript/model:ci python -c "import cv2, torch; print('cv2', cv2.__version__, 'torch', torch.__version__)" | tail -1

      - name: the container serves /health
        # The whole point of 15.11's /health not loading the model: it answers on a runner with no
        # GPU and no weights mounted. If it ever starts loading the checkpoint, this step is where
        # that regression shows up rather than in a container that restart-loops in production.
        run: |
          docker run -d --name model -p 8000:8000 dreamscript/model:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; ok=1; break; fi
            sleep 2
          done
          docker logs model
          test "${ok:-0}" = "1"
          curl -fsS http://127.0.0.1:8000/version; echo
          docker rm -f model
