# Phase 15.10 - the model server, and where the app will sit when Phase 16 builds it.
#
#   docker compose up model          # the inference service on :8000
#   docker compose --profile app up  # once app/ is built; see the note on that service
#
# The `model` service is real and runs 15.11. The `app` service is behind a profile and does not
# start by default, because `app/backend` and `app/frontend` are empty placeholders - Phase 16 has
# not been built. Shipping a compose file whose default `up` fails on a service that cannot exist
# would make the whole file untrustworthy, so the boundary is declared rather than implied.

services:
  model:
    build:
      context: .
      target: serve
    image: dreamscript/model:15.10
    ports:
      - "8000:8000"
    volumes:
      # Read-only: the server loads checkpoints and data, and has no business writing either.
      # mlruns is writable because 15.3's registry is read through it and a future write path
      # (a served run logging itself) should not need the compose file changed.
      - ./experiments:/app/experiments:ro
      - ./data:/app/data:ro
      # 13.6's stage cache, and the one thing in this service that must be writable. Its default
      # is `data/interim/pipeline_cache`, which is inside the read-only mount above - so every
      # `put()` in this container raised OSError into a suppress and the cache silently never
      # worked, in the deployment it exists for. A named volume rather than a bind mount: it is
      # derived and disposable, `docker volume rm` is the whole of its lifecycle, and it must not
      # write into the checkout.
      - pipeline-cache:/var/cache/dreamscript
      - ./mlruns:/app/mlruns
    environment:
      PYTHONUTF8: "1"
      # Torch allocates lazily; capping here rather than in code keeps the GPU rules in one place
      # for anything else sharing the card.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # Points 13.6's cache at the writable volume above. See src/pipeline/cache.py:CACHE_DIR.
      DREAMSCRIPT_CACHE_DIR: "/var/cache/dreamscript"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Required, not decorative: the `app` service below depends on this one with
    # `condition: service_healthy`, and compose refuses to start a dependency chain whose target
    # declares no healthcheck. `docker compose config` does not catch that - it parses, it does
    # not resolve conditions - so the app profile would have failed the first time anyone
    # un-profiled it. /health is 15.11's liveness probe and deliberately does not load the model.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Phase 16's client. Declared so the composition is legible and profiled off so `up` does not
  # fail: `app/` holds only a README today, and that README lists exactly what 16.1 and 16.2 put
  # there. When 16.1 lands, drop the profile.
  app:
    profiles: ["app"]
    build:
      context: ./app
    image: dreamscript/app:16
    ports:
      - "3000:3000"
    environment:
      # The client talks to the model server by service name; the two are separate processes,
      # which is 15.11's whole point.
      MODEL_URL: "http://model:8000"
    depends_on:
      model:
        condition: service_healthy

volumes:
  # Derived and disposable: `docker volume rm dreamscript_pipeline-cache` is the whole of its
  # lifecycle. Declared rather than bind-mounted so the cache never writes into the checkout.
  pipeline-cache:
