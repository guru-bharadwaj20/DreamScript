[project]
name = "dreamscript"
version = "0.1.0"
description = "Converting rough hand-drawn diagrams into executable, runnable code"
authors = [{ name = "Guru Bharadwaj", email = "gururb20@gmail.com" }]
requires-python = "==3.11.*"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
# 13.9's `dreamscript run <dir> --out <dir>`. The same callable as `python -m src.pipeline`,
# which is what the tests drive so the suite does not depend on an editable install.
dreamscript = "src.pipeline.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `addopts = "-q"` used to be here, and it is not a style preference that was removed.
# pytest's `-q` stacks: a second one is `-qq`, which suppresses the totals line entirely. Every
# invocation in this repo that also passes `-q` - both CI test steps, and any hand-run
# `pytest -q` - therefore produced output that ends at the `short test summary info` block with
# **no pass count, no fail count, no skip count and no duration**. CI's own logs read as if the
# suite had produced FAILED lines and nothing else, and the totals for this audit had to be
# recovered by counting progress characters.
#
# Quiet output is still one flag away; a totals line that silently disappears when a caller
# repeats the project's own default is not worth the saved keystroke.
addopts = "-rs"

# Phase 15 - type checking, as a ratchet rather than an all-or-nothing gate.
#
# mypy was installed (there is a `.mypy_cache/` in the tree), reported 661 errors across 193
# files, and was in **no gate at all** - not `make lint`, not pre-commit, not CI. A checker
# nobody runs is a checker whose findings are indistinguishable from noise, and 661 is too many
# to fix in one pass and too many to ignore honestly.
#
# `ignore_missing_imports` removes 318 of those: they are `Library stubs not installed for
# "cv2"`-shaped reports about third-party packages, which say nothing about this code. What is
# left is about this repo, and `scripts/typecheck.py` holds it to a recorded baseline that may
# fall and may not rise.
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
# Off deliberately, for now. Turning any of these on is a separate, measurable step - the point
# of the ratchet is that the number can only go down, not that it is already zero.
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false
pretty = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "experiments", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ARG"]
ignore = [
    "E501",   # line length is enforced by black
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# ARG is off for tests: a pytest fixture requested for its side effect (monkeypatch, a
# tmp_path that only has to exist) is an unused argument by construction, and so is every
# `lambda *a, **k:` handed to monkeypatch.setattr. Enforcing it here would mean noqa on
# most of the suite.
"tests/*" = ["S101", "ARG"]   # asserts are the point of a test

# ARG (unused function/method/lambda argument) is selected above so new code cannot add one
# silently. These 31 files carry the 50 that already existed, and they are listed
# individually rather than waved through with a blanket ignore: the list is the inventory, it
# shrinks in a diff, and a file that is not on it cannot grow one.
#
# Most are interface arguments - a callback signature, a protocol conformance, one member of a
# family of functions that must be callable the same way - which is why they are not simply
# deleted. The six that were *misleading* rather than merely unused were fixed instead, in the
# commit that added this block: `reference_code` on `functional.expected`, `n_jobs` on
# `fastpath.run` and `optimizers.curves`, `loss` on `svm.support_vector_count`, `page_w` on
# `ownership.container_cost` and `diagram` on `repair.roles_and_confidence`.
"src/assemble/graphrepair.py" = ["ARG"]
"src/classify/bagging.py" = ["ARG"]
"src/classify/shapley.py" = ["ARG"]
"src/cluster/validity.py" = ["ARG"]
"src/codegen/quality.py" = ["ARG"]
"src/codegen/sketch2code.py" = ["ARG"]
"src/detect/tiling.py" = ["ARG"]
"src/eval/similarity.py" = ["ARG"]
"src/eval/structural.py" = ["ARG"]
"src/features/extractor.py" = ["ARG"]
"src/features/impute.py" = ["ARG"]
"src/ir/convert/sketch2code.py" = ["ARG"]
"src/ir/qa.py" = ["ARG"]
"src/llm/pipeline.py" = ["ARG"]
"src/ocr/ownlearn.py" = ["ARG"]
"src/ocr/trocr.py" = ["ARG"]
"src/parse/observations.py" = ["ARG"]
"src/parse/softshapes.py" = ["ARG"]
"src/preprocess/robustness.py" = ["ARG"]
"src/rl/ablation.py" = ["ARG"]
"src/rl/abstraction.py" = ["ARG"]
"src/rl/actions.py" = ["ARG"]
"src/rl/curriculum.py" = ["ARG"]
"src/rl/dqn.py" = ["ARG"]
"src/rl/emit.py" = ["ARG"]
"src/rl/env.py" = ["ARG"]
"src/rl/episode.py" = ["ARG"]
"src/rl/reward.py" = ["ARG"]
"src/rl/shaping.py" = ["ARG"]
"src/rl/state.py" = ["ARG"]
"src/utils/stage.py" = ["ARG"]
