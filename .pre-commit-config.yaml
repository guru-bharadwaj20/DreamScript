# Phase 0.2.6 — hooks that run on every commit.
# Install once:  .venv/Scripts/pre-commit.exe install
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]   # model weights and datasets belong in DVC, not git
      - id: debug-statements    # no stray breakpoint() in committed code

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  # Kept, and `notebooks/` is not. That directory held one `.gitkeep` and nothing else, and an
  # empty placeholder for work that never arrived is a claim the repo cannot support. The hook is
  # not scoped to it - it matches any `.ipynb` anywhere - so it still enforces the rule
  # `docs/conventions.md` section 4 states, for a notebook committed wherever one is committed.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout   # notebooks are committed without output cells
