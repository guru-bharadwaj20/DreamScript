# DreamScript — canonical conda environment specification.
#
#   conda env create -f env.yml
#   conda activate dreamscript
#
# The project is developed with `uv` (see pyproject.toml / requirements/) on machines
# without conda; both paths install the same pinned Python and package set.
name: dreamscript
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Every layer, in the order `make env` and the Dockerfile use. `serve.txt` and `dev.txt` were
  # missing here and from `make env`, so a conda user who followed this file got an environment in
  # which the inference service, the linters and the DVC targets all failed to start. The six
  # runtime layers are what CI installs; `dev.txt` is the tooling a developer also needs and CI
  # deliberately does not.
  - pip:
      - -r requirements/base.txt
      - -r requirements/torch.txt
      - -r requirements/classical.txt
      - -r requirements/cv.txt
      - -r requirements/serve.txt
      - -r requirements/genai.txt
      - -r requirements/dev.txt
